services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: heritage
      POSTGRES_DB: heritage_slabs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage_slabs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
